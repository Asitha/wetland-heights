name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: engine
        run: npm ci

      - name: Run tests
        working-directory: engine
        run: npm test

      - name: Verify build
        working-directory: engine
        run: node build.js --all --content ../content --out ../_site
