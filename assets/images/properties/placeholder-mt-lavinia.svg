<svg width="720" height="480" viewBox="0 0 720 480" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="720" y2="480">
            <stop offset="0%" stop-color="#93C5FD"/>
            <stop offset="50%" stop-color="#BFDBFE"/>
            <stop offset="100%" stop-color="#A7C7E7"/>
        </linearGradient>
        <filter id="blur">
            <feGaussianBlur stdDeviation="8"/>
        </filter>
    </defs>

    <!-- Blurred background suggesting a property -->
    <rect width="720" height="480" fill="url(#bg)"/>

    <!-- Blurred shapes suggesting rooms/furniture -->
    <g filter="url(#blur)" opacity="0.3">
        <rect x="40" y="60" width="280" height="180" rx="12" fill="#6B7280"/>
        <rect x="400" y="60" width="280" height="180" rx="12" fill="#6B7280"/>
        <rect x="40" y="280" width="200" height="140" rx="12" fill="#6B7280"/>
        <rect x="280" y="280" width="200" height="140" rx="12" fill="#6B7280"/>
        <circle cx="600" cy="360" r="70" fill="#3B82F6"/>
    </g>

    <!-- Semi-transparent overlay -->
    <rect width="720" height="480" fill="white" opacity="0.25"/>

    <!-- Central info card -->
    <rect x="160" y="130" width="400" height="220" rx="16" fill="white" opacity="0.92"/>
    <rect x="160" y="130" width="400" height="220" rx="16" stroke="#E5E7EB" stroke-width="1" fill="none"/>

    <!-- Coming Soon text -->
    <text x="360" y="195" text-anchor="middle" fill="#1A1A1A" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="28">Coming Soon</text>

    <!-- Divider line -->
    <line x1="220" y1="215" x2="500" y2="215" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Listing details -->
    <text x="360" y="250" text-anchor="middle" fill="#6B7280" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="15">2 Bedrooms  ·  Pool  ·  Beach Road</text>
    <text x="360" y="278" text-anchor="middle" fill="#6B7280" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="14">Mount Lavinia, Sri Lanka</text>

    <!-- Small pool icon -->
    <circle cx="360" cy="320" r="14" stroke="#3B82F6" stroke-width="1.5" fill="none"/>
    <path d="M349 320c2-3 4-3 6 0s4 3 6 0s4-3 6 0" stroke="#3B82F6" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
